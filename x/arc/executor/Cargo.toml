[package]
name = "indexer-arc-executor"
default-run = "indexer-arc-executor"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[dependencies]
sha2 = "0.10"
reth-libmdbx = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-prune-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
alloy-trie = { version = "0.9", features = ["ethereum"] }
arc-evm = { git = "https://github.com/circlefin/arc-node", rev = "6e764023ee6515fe70573e123ed2db912a7207b4" }
arc-execution-config = { git = "https://github.com/circlefin/arc-node", rev = "6e764023ee6515fe70573e123ed2db912a7207b4" }
alloy-consensus = "=2.0.4"
alloy-eips = "=2.0.4"
alloy-evm = "=0.34.0"
alloy-primitives = { version = "=1.5.7", features = ["serde"] }
alloy-rlp = "0.3"
base64 = "0.22"
eyre = "0.6"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
rustix = { version = "1.1", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", features = ["evm"] }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-primitives-traits = "=0.3.1"
reth-revm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-trie = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-ethereum-engine-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
revm = "=38.0.0"

reth-db-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }

reth-stages-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }

reth-trie-db = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }

[dev-dependencies]
alloy-genesis = "=2.0.4"
reth-chain-state = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
arc-execution-config = { git = "https://github.com/circlefin/arc-node", rev = "6e764023ee6515fe70573e123ed2db912a7207b4", features = ["test-utils"] }

# Match the audited upstream security patch; dependency workspace patches do
# not propagate into this standalone consumer.
[patch.crates-io]
ark-relations = { git = "https://github.com/arkworks-rs/snark.git", rev = "9c528529763f1a0a2e0cba83528f93d32247d621" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[[bin]]
name = "arc-native-maintenance"
path = "src/maintenance.rs"

[[bin]]
name = "arc-native-bootstrap"
path = "src/bootstrap_cli.rs"
