[package]
name = "indexer-arc-node-feed"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[features]
default = []
reth = ["dep:reth-exex", "dep:reth-node-api", "dep:reth-provider", "dep:reth-ethereum-primitives", "dep:alloy-consensus", "dep:alloy-eips", "dep:alloy-rlp", "dep:futures"]

[dependencies]
base64 = "0.22"
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros", "signal"] }
alloy-primitives = { version = "=1.5.7", features = ["serde"] }
alloy-consensus = { version = "=2.0.4", optional = true }
alloy-eips = { version = "=2.0.4", optional = true }
alloy-rlp = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }
reth-exex = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", optional = true }
reth-node-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", optional = true }
reth-provider = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", optional = true }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0", optional = true }
