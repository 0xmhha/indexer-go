name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job installs the Go of go.mod's toolchain line and uses it as is.
# With go-version-file setup-go installed the go line and each job then
# downloaded the toolchain through the module proxy and checksum database;
# when those did not answer the job failed before running anything.
# GOTOOLCHAIN=local makes a mismatch fail instead of downloading; the lint
# job checks the pin against go.mod.
env:
  GO_VERSION: "1.26.8"
  GOTOOLCHAIN: local

# The jobs run the same commands as a local check (Makefile, scripts/), so
# CI and local results mean the same thing.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go version matches go.mod
        run: |
          want=$(sed -n 's/^toolchain go//p' go.mod)
          [ "$want" = "$GO_VERSION" ] || { echo "go.mod toolchain go$want, CI GO_VERSION $GO_VERSION"; exit 1; }
          for m in execwire/go.mod x/stablenet/executor/go.mod examples/*/go.mod; do
            [ "$(sed -n 's/^toolchain go//p' "$m")" = "$want" ] || { echo "$m toolchain differs from go.mod"; exit 1; }
          done
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "not gofmt-clean:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        run: make lint
      - name: Wire module vet and lint
        working-directory: execwire
        run: |
          go vet ./...
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: StableNet executor vet and lint
        working-directory: x/stablenet/executor
        run: |
          go vet ./...
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: golangci-lint (tools/astgraph)
        working-directory: tools/astgraph
        run: |
          go vet ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./... -count=1 -timeout 20m
      - name: Event bus shutdown concurrency
        run: GOMAXPROCS=1 go test -race -count=200 -timeout=5m -run '^(TestEventBusStopDrainsAccepted|TestEventBusConcurrentStopPublishPreservesAccepted)$' ./pkg/events
      - name: Execution queue, recovery, and API concurrency
        run: GOMAXPROCS=1 go test -race -count=200 -timeout=10m -run '^(TestScheduler|TestController|TestReceiver|TestExecution)' ./pkg/execution ./pkg/fetch ./pkg/api ./pkg/api/graphql ./pkg/api/jsonrpc ./internal/api/rest
      - name: Execution runtime lifecycle concurrency
        run: GOMAXPROCS=1 go test -race -count=200 -timeout=5m -run '^TestExecutionRuntime' ./pkg/app
      - name: Wire module contracts and concurrency
        run: |
          make test-execwire
          cd execwire
          GOMAXPROCS=1 go test -race -count=200 -timeout=5m -run '^TestConn' ./...
          GOMAXPROCS=1 go test -race -count=200 -timeout=5m -run '^TestSupervisor' ./retention
      - name: StableNet replay and spool contracts and concurrency
        run: |
          make test-executor-stablenet
          cd x/stablenet/executor
          GOMAXPROCS=1 go test -race -count=200 -timeout=5m -run '^(TestCancelLogger|TestReplayCancellationDuringEVM)' ./...
          GOMAXPROCS=1 go test -race -count=200 -timeout=5m -run '^(TestConcurrentCancellationAndCloseJoin|TestRetentionConcurrentReadCloseAndGenerationJoin)$' ./spool
          GOMAXPROCS=1 go test -race -count=200 -timeout=10m -run '^(TestClient|TestTransfer|TestPrivateDial)' ./exporter
          GOMAXPROCS=1 go test -race -count=200 -timeout=5m -run '^(TestNodeRuntime|TestCapacityBudgetResumeAndConcurrentChecks)' ./nodebackend
          GOMAXPROCS=1 go test -race -count=200 -timeout=15m -run '^TestCompactCapacityAndForeignLeasePreserveNode$' ./nodestore
      - name: Pebble cache lifecycle
        # Pebble disables its cache leak finalizer under -race.
        run: make test-cache-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Operations drafts (offline)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r deployments/testnets/requirements.txt
          python -m unittest discover -s deployments/testnets -p 'test_preflight.py' -v
          python deployments/testnets/preflight.py
          sh -n deployments/testnets/indexer-entrypoint.sh

  postgres:
    runs-on: ubuntu-latest
    # The test job runs in UTC; this one in another zone, so stored or
    # returned values that depend on the host's time zone fail a job.
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: PostgreSQL adapter and end-to-end suite
        run: ./scripts/test-postgres.sh
      - name: Execution IPC and DB integration concurrency
        run: GOMAXPROCS=1 ./scripts/test-postgres.sh ./pkg/app -race -v -failfast -count=200 -timeout=30m -run '^TestExecutionAppFrozenWBFTIPCReorgRestartAndLostACK$'
      - name: Execution DB admission and recovery concurrency
        run: GOMAXPROCS=1 ./scripts/test-postgres.sh ./pkg/storage/postgres -race -count=200 -timeout=20m -run '^(TestExecutionPartConcurrentReadersAndRewindFence|TestExecutionReadSnapshotReservedSlotParallelCancelAndRewind|TestExecutionReadSnapshotUsesReservedFourthSlotAndRejectsWrites|TestExecutionReadSnapshotClosesAbandonedRowsAndRejectsRetainedContext|TestExecutionReadSnapshotCancellationJoinsActiveSQL|TestExecutionRewindReadAdmissionFence|TestExecutionRetentionDrainsReadLeaseAndCancel)$'

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Example modules
        run: make test-examples
