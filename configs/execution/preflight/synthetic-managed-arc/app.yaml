    anchor_height: 100
    anchor_hash: '0x1111111111111111111111111111111111111111111111111111111111111111'
    anchor_root: '0x2222222222222222222222222222222222222222222222222222222222222222'
    ingress:
      module: arc.native
      window: arc-raw
